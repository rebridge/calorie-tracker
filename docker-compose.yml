services:
  calories:
    build: .
    image: calorie-counter:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]   # localhost only; reach it via tailscale serve
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TZ: America/New_York        # sets the day boundary
      DATABASE_PATH: /data/calories.db
    volumes:
      - ./data:/data
    # The server drains requests and checkpoints the SQLite WAL on SIGTERM, within ~8s.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
