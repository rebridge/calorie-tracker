services:
  calories:
    build: .
    image: calorie-counter:latest
    restart: unless-stopped
    ports:
      # Set in .env. CALORIES_BIND is the host address to listen on: keep 127.0.0.1
      # when `tailscale serve` fronts the app, or use the host's Tailscale IP (100.x.y.z).
      - "${CALORIES_BIND:-127.0.0.1}:${CALORIES_PORT:-8080}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TZ: ${TZ:-America/New_York}        # sets the day boundary; set in .env
      DATABASE_PATH: /data/calories.db
    volumes:
      - ./data:/data
    # The server drains requests and checkpoints the SQLite WAL on SIGTERM, within ~8s.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
